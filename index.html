<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Utility & Rent Tracker</title>
  <meta name="theme-color" content="#121212">
  <link rel="apple-touch-icon" href="icon.PNG">
  <link rel="icon" type="image/png" href="icon.PNG">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --card-subtle: #292929;
      --accent: #2563eb;
      --green: #10b981;
      --orange: #f59e0b;
      --red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 80px;
    }

    header {
      background-color: var(--card-bg);
      padding: 16px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .tab-content {
      display: none;
      padding: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background-color: var(--card-subtle);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active {
      opacity: 0.8;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #fff;
    }

    .btn-green {
      background-color: var(--green);
      color: #fff;
    }

    .btn-red {
      background-color: var(--red);
      color: #fff;
    }

    .btn-subtle {
      background-color: var(--card-subtle);
      color: var(--text-main);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-box {
      background-color: var(--card-subtle);
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }

    .stat-val {
      font-size: 1.3rem;
      font-weight: 700;
      margin: 4px 0;
    }

    .stat-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .action-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .action-btn.edit {
      color: #60a5fa;
      border-color: #1e3a8a;
    }

    .action-btn.del {
      color: var(--red);
      border-color: #7f1d1d;
    }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 0 env(safe-area-inset-bottom, 8px);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      flex: 1;
      padding: 4px 0;
    }

    .nav-item.active {
      color: #3b82f6;
    }

    .nav-icon {
      font-size: 1.2rem;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="header-title">AC Tracker</h1>
  </header>

  <!-- TAB 1: AC TRACKER -->
  <div id="tab-ac" class="tab-content active">
    <div class="card" style="text-align: center; padding: 24px 16px;">
      <div id="ac-status" style="font-size: 0.9rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px;">STATUS: OFF</div>
      <div id="current-timer" style="font-size: 2.4rem; font-weight: 800; font-variant-numeric: tabular-nums; margin-bottom: 16px;">00:00:00</div>
      <button id="toggle-ac-btn" class="btn btn-green" onclick="toggleAC()">LOG ON</button>
    </div>

    <div class="card">
      <div class="card-title">Cycle AC Runtime</div>
      <div class="grid-2">
        <div class="stat-box">
          <div class="stat-sub">Total Runtime</div>
          <div id="ac-total-time" class="stat-val">0h 0m</div>
          <div id="ac-est-cost" class="stat-sub">₹0 - ₹0</div>
        </div>
        <div class="stat-box">
          <div class="stat-sub">Daily Average</div>
          <div id="ac-daily-avg" class="stat-val">0h 0m</div>
          <div id="ac-cycle-days" class="stat-sub">0 days</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Recent AC Sessions</div>
      <div id="ac-history-list"></div>
    </div>
  </div>

  <!-- TAB 2: RENT & METER -->
  <div id="tab-meter" class="tab-content">
    <div class="card">
      <div class="card-title">Add Reading</div>
      <label>Reading Date</label>
      <input type="date" id="meter-date">
      <label>Meter Units</label>
      <input type="number" id="meter-val" placeholder="e.g. 294" step="any">
      <button class="btn btn-primary" onclick="saveMeterReading()">Save Reading</button>
    </div>

    <div class="card">
      <div class="card-title">Monthly Export & Backup</div>
      <button class="btn btn-primary" onclick="copyMonthlyReport()">📋 Copy Monthly Report for Gemini</button>
      <button class="btn btn-subtle" onclick="downloadBackup()">📥 Download Backup (.json)</button>
      <button class="btn btn-subtle" style="border-color: #059669; color: #34d399;" onclick="restoreOctCycle()">🔄 Restore Oct Cycle (Pre-loaded)</button>
    </div>

    <div class="card">
      <div class="card-title">Consumption Analytics</div>
      <div class="grid-2">
        <div class="stat-box">
          <div class="stat-sub">Daily Avg Rate</div>
          <div id="analytics-daily" class="stat-val">0 u/d</div>
          <div id="analytics-daily-cost" class="stat-sub">₹0.00/day</div>
        </div>
        <div class="stat-box">
          <div class="stat-sub">Projected 30-Day</div>
          <div id="analytics-proj" class="stat-val">0 u</div>
          <div id="analytics-proj-cost" class="stat-sub">₹0</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Meter Reading History</div>
      <div id="meter-history-list"></div>
    </div>
  </div>

  <nav class="nav-bar">
    <div class="nav-item active" id="nav-ac" onclick="switchTab('ac')">
      <div class="nav-icon">❄️</div>
      <div>AC Tracker</div>
    </div>
    <div class="nav-item" id="nav-meter" onclick="switchTab('meter')">
      <div class="nav-icon">⚡</div>
      <div>Rent & Meter</div>
    </div>
  </nav>

  <script>
    const CONFIG = {
      ratePerUnit: 8,
      rent: 12000,
      water: 300,
      acKwMin: 0.8,
      acKwMax: 1.2
    };

    let acSessions = JSON.parse(localStorage.getItem('acSessions') || '[]');
    let meterReadings = JSON.parse(localStorage.getItem('meterReadings') || '[]');
    let currentSession = JSON.parse(localStorage.getItem('currentSession') || 'null');
    let timerInterval = null;

    function init() {
      // Auto-populate with recorded history if empty
      if (meterReadings.length === 0) {
        meterReadings = [
          { date: '2026-10-08', units: 115 },
          { date: '2026-10-11', units: 145 },
          { date: '2026-10-15', units: 179 },
          { date: '2026-10-19', units: 207 },
          { date: '2026-10-21', units: 221 },
          { date: '2026-10-27', units: 263 },
          { date: '2026-10-30', units: 286 },
          { date: '2026-10-31', units: 294 }
        ];
        saveMeterData();
      }

      if (acSessions.length === 0) {
        acSessions = [
          { date: '2026-10-31', start: '2026-10-31T14:00:00.000Z', end: '2026-10-31T17:00:00.000Z', duration: 4661 } // 77h 41m total
        ];
        localStorage.setItem('acSessions', JSON.stringify(acSessions));
      }

      document.getElementById('meter-date').value = new Date().toISOString().split('T')[0];

      if (currentSession) startTimerDisplay();
      renderAC();
      renderMeterHistory();
    }

    function restoreOctCycle() {
      meterReadings = [
        { date: '2026-10-08', units: 115 },
        { date: '2026-10-11', units: 145 },
        { date: '2026-10-15', units: 179 },
        { date: '2026-10-19', units: 207 },
        { date: '2026-10-21', units: 221 },
        { date: '2026-10-27', units: 263 },
        { date: '2026-10-30', units: 286 },
        { date: '2026-10-31', units: 294 }
      ];
      acSessions = [
        { date: '2026-10-31', start: '2026-10-31T14:00:00.000Z', end: '2026-10-31T17:00:00.000Z', duration: 4661 }
      ];
      saveMeterData();
      localStorage.setItem('acSessions', JSON.stringify(acSessions));
      renderAC();
      renderMeterHistory();
      alert('October Cycle restored with correct Oct 30 reading!');
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

      if (tab === 'ac') {
        document.getElementById('tab-ac').classList.add('active');
        document.getElementById('nav-ac').classList.add('active');
        document.getElementById('header-title').innerText = 'AC Tracker';
      } else {
        document.getElementById('tab-meter').classList.add('active');
        document.getElementById('nav-meter').classList.add('active');
        document.getElementById('header-title').innerText = 'Electricity Meter & Rent';
      }
    }

    /* AC TIMER FUNCTIONS */
    function toggleAC() {
      if (!currentSession) {
        currentSession = { startTime: new Date().toISOString() };
        localStorage.setItem('currentSession', JSON.stringify(currentSession));
        startTimerDisplay();
      } else {
        const endTime = new Date().toISOString();
        const durationMin = Math.round((new Date(endTime) - new Date(currentSession.startTime)) / 60000);
        if (durationMin > 0) {
          acSessions.unshift({
            date: currentSession.startTime.split('T')[0],
            start: currentSession.startTime,
            end: endTime,
            duration: durationMin
          });
          localStorage.setItem('acSessions', JSON.stringify(acSessions));
        }
        currentSession = null;
        localStorage.removeItem('currentSession');
        clearInterval(timerInterval);
        document.getElementById('current-timer').innerText = '00:00:00';
        document.getElementById('ac-status').innerText = 'STATUS: OFF';
        document.getElementById('ac-status').style.color = 'var(--text-muted)';
        const btn = document.getElementById('toggle-ac-btn');
        btn.innerText = 'LOG ON';
        btn.className = 'btn btn-green';
      }
      renderAC();
    }

    function startTimerDisplay() {
      const btn = document.getElementById('toggle-ac-btn');
      btn.innerText = 'LOG OFF';
      btn.className = 'btn btn-red';
      document.getElementById('ac-status').innerText = 'STATUS: ACTIVE (RUNNING)';
      document.getElementById('ac-status').style.color = 'var(--green)';

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const diffMs = new Date() - new Date(currentSession.startTime);
        const hrs = String(Math.floor(diffMs / 3600000)).padStart(2, '0');
        const mins = String(Math.floor((diffMs % 3600000) / 60000)).padStart(2, '0');
        const secs = String(Math.floor((diffMs % 60000) / 1000)).padStart(2, '0');
        document.getElementById('current-timer').innerText = `${hrs}:${mins}:${secs}`;
      }, 1000);
    }

    function renderAC() {
      let totalMins = acSessions.reduce((acc, s) => acc + (s.duration || 0), 0);
      let hours = Math.floor(totalMins / 60);
      let mins = totalMins % 60;
      document.getElementById('ac-total-time').innerText = `${hours}h ${mins}m`;

      const kwhMin = (totalMins / 60) * CONFIG.acKwMin;
      const kwhMax = (totalMins / 60) * CONFIG.acKwMax;
      const costMin = Math.round(kwhMin * CONFIG.ratePerUnit);
      const costMax = Math.round(kwhMax * CONFIG.ratePerUnit);
      document.getElementById('ac-est-cost').innerText = `₹${costMin} - ₹${costMax}`;

      const cycleDays = meterReadings.length > 1 ? 
        Math.max(1, Math.round((new Date(meterReadings[meterReadings.length - 1].date) - new Date(meterReadings[0].date)) / (1000 * 60 * 60 * 24))) : 1;
      
      const avgMins = Math.round(totalMins / cycleDays);
      document.getElementById('ac-daily-avg').innerText = `${Math.floor(avgMins / 60)}h ${avgMins % 60}m`;
      document.getElementById('ac-cycle-days').innerText = `${cycleDays} days`;

      const list = document.getElementById('ac-history-list');
      list.innerHTML = acSessions.slice(0, 5).map(s => `
        <div class="history-item">
          <div>
            <div style="font-weight: 600;">${s.date}</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">${new Date(s.start).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})} - ${new Date(s.end).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
          </div>
          <div style="font-weight: 700;">${Math.floor(s.duration / 60)}h ${s.duration % 60}m</div>
        </div>
      `).join('') || '<div style="color: var(--text-muted); text-align: center; padding: 12px 0;">No sessions recorded yet.</div>';
    }

    /* METER & RENT FUNCTIONS */
    function saveMeterData() {
      meterReadings.sort((a, b) => new Date(a.date) - new Date(b.date));
      localStorage.setItem('meterReadings', JSON.stringify(meterReadings));
    }

    function saveMeterReading() {
      const date = document.getElementById('meter-date').value;
      const val = parseFloat(document.getElementById('meter-val').value);

      if (!date || isNaN(val)) {
        alert('Please enter a valid date and meter value.');
        return;
      }

      meterReadings.push({ date, units: val });
      saveMeterData();
      document.getElementById('meter-val').value = '';
      renderMeterHistory();
    }

    function editMeterReading(index) {
      const item = meterReadings[index];
      if (!item) return;

      const newDate = prompt("Edit Reading Date (YYYY-MM-DD):", item.date);
      if (newDate === null) return;

      const newUnits = prompt("Edit Meter Reading (Units):", item.units);
      if (newUnits === null) return;

      const parsedUnits = parseFloat(newUnits);
      if (isNaN(parsedUnits)) {
        alert("Please enter a valid numeric unit value.");
        return;
      }

      meterReadings[index].date = newDate.trim();
      meterReadings[index].units = parsedUnits;

      saveMeterData();
      renderMeterHistory();
    }

    function deleteMeterReading(index) {
      if (confirm(`Delete the reading for ${meterReadings[index].date} (${meterReadings[index].units} u)?`)) {
        meterReadings.splice(index, 1);
        saveMeterData();
        renderMeterHistory();
      }
    }

    function renderMeterHistory() {
      saveMeterData();
      const list = document.getElementById('meter-history-list');

      if (meterReadings.length === 0) {
        list.innerHTML = '<div style="color: var(--text-muted); text-align: center; padding: 12px 0;">No readings logged.</div>';
        return;
      }

      let html = '';
      for (let i = meterReadings.length - 1; i >= 0; i--) {
        const item = meterReadings[i];
        const prev = i > 0 ? meterReadings[i - 1] : null;
        const diff = prev ? (item.units - prev.units) : 0;
        const isBaseline = i === 0;

        html += `
          <div class="history-item">
            <div>
              <div style="font-weight: 600;">${item.date}</div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">
                ${isBaseline ? 'Baseline' : (diff >= 0 ? '+' + diff.toFixed(1) + ' units' : diff.toFixed(1) + ' units')}
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="font-weight: 700; margin-right: 4px;">${item.units} u</span>
              <button class="action-btn edit" onclick="editMeterReading(${i})">✎ Edit</button>
              <button class="action-btn del" onclick="deleteMeterReading(${i})">✕</button>
            </div>
          </div>
        `;
      }
      list.innerHTML = html;

      // Update Analytics
      if (meterReadings.length > 1) {
        const first = meterReadings[0];
        const latest = meterReadings[meterReadings.length - 1];
        const consumed = latest.units - first.units;
        const days = Math.max(1, Math.round((new Date(latest.date) - new Date(first.date)) / (1000 * 60 * 60 * 24)));
        const dailyAvg = (consumed / days);
        const projected = dailyAvg * 30;

        document.getElementById('analytics-daily').innerText = `${dailyAvg.toFixed(2)} u/d`;
        document.getElementById('analytics-daily-cost').innerText = `₹${(dailyAvg * CONFIG.ratePerUnit).toFixed(2)}/day`;
        document.getElementById('analytics-proj').innerText = `${projected.toFixed(1)} u`;
        document.getElementById('analytics-proj-cost').innerText = `₹${Math.round(projected * CONFIG.ratePerUnit)}`;
      }
    }

    /* BACKUP & EXPORT FUNCTIONS */
    function copyMonthlyReport() {
      if (meterReadings.length === 0) {
        alert('No meter readings available.');
        return;
      }

      const baseline = meterReadings[0];
      const latest = meterReadings[meterReadings.length - 1];
      const totalUnits = latest.units - baseline.units;
      const elecCost = totalUnits * CONFIG.ratePerUnit;
      const totalPayable = CONFIG.rent + CONFIG.water + elecCost;

      let totalMins = acSessions.reduce((acc, s) => acc + (s.duration || 0), 0);
      let hours = Math.floor(totalMins / 60);
      let mins = totalMins % 60;
      const days = Math.max(1, Math.round((new Date(latest.date) - new Date(baseline.date)) / (1000 * 60 * 60 * 24)));
      const avgMins = Math.round(totalMins / days);

      let logStr = meterReadings.map((r, i) => {
        if (i === 0) return `- ${r.date}: ${r.units} units (Baseline)`;
        const diff = r.units - meterReadings[i - 1].units;
        return `- ${r.date}: ${r.units} units (+${diff})`;
      }).join('\n');

      const report = `### Monthly Double-Check Report
**Baseline:** ${baseline.units} units (${baseline.date})
**Latest Meter Reading:** ${latest.units} units (${latest.date})
**Total Consumption:** ${totalUnits} units
**Electricity Rate:** ₹${CONFIG.ratePerUnit}/unit
**Electricity Cost:** ₹${elecCost}

**Provisional Rent Bill:**
- Rent: ₹${CONFIG.rent}
- Water: ₹${CONFIG.water}
- Electricity: ₹${elecCost}
- **Total Payable:** ₹${totalPayable}

**Meter Readings Log:**
${logStr}

**AC Runtime Cumulative:**
- Cycle Total Runtime: ${hours}h ${mins}m
- Cycle Daily Average: ${Math.floor(avgMins / 60)}h ${avgMins % 60}m
- Estimated AC Power Cost: ₹${Math.round((totalMins / 60) * CONFIG.acKwMin * CONFIG.ratePerUnit)} - ₹${Math.round((totalMins / 60) * CONFIG.acKwMax * CONFIG.ratePerUnit)}`;

      navigator.clipboard.writeText(report).then(() => {
        alert('Monthly report copied to clipboard! Paste it directly into Gemini.');
      }).catch(err => {
        alert('Could not copy report: ' + err);
      });
    }

    function downloadBackup() {
      const data = {
        acSessions,
        meterReadings,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tracker-backup-${new Date().toISOString().split('T')[0]}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    window.onload = init;
  </script>
</body>
</html>
